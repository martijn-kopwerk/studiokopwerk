<!doctype html>
<html lang="nl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07090e" />
    <!-- Per-page title, description, canonical and og tags: src/lib/head.ts, filled in by scripts/prerender.mjs -->
    <!--app-head-->
    <meta property="og:site_name" content="Studio Kopwerk" />
    <meta property="og:locale" content="nl_NL" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Studio Kopwerk",
        "url": "https://www.studiokopwerk.nl",
        "logo": "https://www.studiokopwerk.nl/favicon.png",
        "image": "https://www.studiokopwerk.nl/og-image.png",
        "description": "Goed in je vak, maar vastgelopen in het digitale eromheen? Wij maken het eenvoudig, met AI en samen met jou. Zien wat wérkt.",
        "email": "hallo@studiokopwerk.nl",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "NL"
        },
        "knowsAbout": [
          "Werk dat logisch loopt",
          "Websites die klanten begrijpen",
          "AI voor terugkerend werk",
          "Schermen die zonder uitleg werken"
        ],
        "slogan": "Zien wat wérkt."
      }
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
